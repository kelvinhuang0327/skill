  - WORKER_TASK_TEMPLATE.md

restrictions:
  db: [forbidden]
  data: [forbidden]
  runtime: [project_runtime_forbidden]
  network: [forbidden]
  git: [remote_creation_forbidden, push_forbidden]
  activation: [pilot_activation_forbidden, control_plane_activation_forbidden, legacy_replacement_forbidden]
  memory: [default_write_forbidden_no_continuing_authorization]

test_aliases:
  full_suite: LC_ALL=C.UTF-8 LANG=C.UTF-8 ruby prototype/test_control_plane.rb
  manifest_lint: LC_ALL=C.UTF-8 LANG=C.UTF-8 ruby prototype/control_plane.rb lint pilot1/self-hosted/manifest-low.yaml --project-root /Users/kelvin/VibeCoding-WorkSpace/prompt/control-plane-v1 --source-label pilot1/self-hosted/manifest-low.yaml

worktree_defaults:
