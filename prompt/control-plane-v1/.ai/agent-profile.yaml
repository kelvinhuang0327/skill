# Repo-local Project Attachment profile for control-plane-v1.
# This file binds project identity and additional restrictions; it does not redefine Shared Core rules.

project:
  name: control-plane-v1
  canonical_repo: /Users/kelvin/VibeCoding-WorkSpace/prompt/control-plane-v1
  canonical_branch: main
  local_only: true
  status: 1.1.0-draft.1

control_plane:
  source_path: /Users/kelvin/VibeCoding-WorkSpace/prompt/control-plane-v1
  version: 1.1.0-draft.1
  schema_version: 1

project_attachment:
